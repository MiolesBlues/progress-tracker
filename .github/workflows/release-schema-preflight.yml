name: Read-only Supabase schema gate
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Supabase project to inspect
        required: true
        type: choice
        options:
          - staging
          - production
permissions:
  contents: read
jobs:
  schema-preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ENVIRONMENT: ${{ inputs.environment }}
      SUPABASE_PROJECT_REF: ${{ inputs.environment == 'production' && 'szdmzvsenrnjxgjgregf' || 'fdzcwhzszbmpxyawrzzf' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Inspect target schema in a read-only transaction
        env:
          RELEASE_DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SUPABASE_DATABASE_URL || secrets.STAGING_SUPABASE_DATABASE_URL }}
        run: bun run preflight:release
