name: Quality checks
on:
  pull_request:
  push:
    branches: [main, "fix/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:db
      - run: bun run test:toolchain
      - run: bun run build
        env:
          VITE_SUPABASE_URL: https://workout-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      - run: bun run audit
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
