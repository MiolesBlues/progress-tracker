name: Quality checks
on:
  pull_request:
  push:
    branches: [main, "fix/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://workout-e2e.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      SUPABASE_URL: https://workout-e2e.invalid
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Reject manifest, lockfile or generator drift before install
        run: bun run check:dependencies
      - name: Clean frozen install (Bun 1.4.3)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Installation must preserve committed dependency files
        run: git diff --exit-code -- package.json bun.lock
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:db
      - run: bun run test:toolchain
      - run: bun run build
      - run: bun run audit
      - name: Install pinned Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium webkit
      - name: Release E2E (mock API, Chromium and WebKit)
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
