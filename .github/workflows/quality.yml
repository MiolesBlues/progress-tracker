name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and PR events for the same head share a group so a newer event cancels
  # an in-flight duplicate without cancelling checks on unrelated branches.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"
  SUPABASE_ENVIRONMENT: test
  VITE_SUPABASE_ENVIRONMENT: test
  SUPABASE_URL: https://workout-e2e.invalid
  VITE_SUPABASE_URL: https://workout-e2e.invalid
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
  SUPABASE_SERVICE_ROLE_KEY: ""
  SUPABASE_PROJECT_REF: ""
  VITE_SUPABASE_PROJECT_REF: ""
  SUPABASE_PROJECT_ID: ""
  VITE_SUPABASE_PROJECT_ID: ""
  ALLOW_STAGING_DEV: "false"
  RELEASE_DATABASE_URL: ""

jobs:
  quality:
    name: Dependency, quality, SQL and runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Restore Bun package cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-quality
          restore-keys: |
            ${{ runner.os }}-bun-1.4.3-

      - name: Reject local environment and database artifacts
        run: |
          if [[ -e .env || -e .env.local ]]; then
            echo "Local environment files must not be present in CI workspace" >&2
            exit 1
          fi
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_env" ]]; then
            echo "Tracked environment files are forbidden in CI" >&2
            exit 1
          fi
          tracked_data="$(git ls-files | grep -Ei '(^|/)(pgdata|database-data)(/|$)|\.(dump|backup|pgdump)$' || true)"
          if [[ -n "$tracked_data" ]]; then
            echo "Tracked database artifacts are forbidden in CI" >&2
            exit 1
          fi

      - name: Reject manifest, lockfile or generator drift before install
        run: bun run check:dependencies

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Installation must preserve committed dependency files
        run: git diff --exit-code -- package.json bun.lock

      - name: Save Bun package cache for trusted branch runs
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-quality

      - name: Dependency audit
        run: bun audit

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

      - name: Vitest
        run: bun run test

      - name: SQL and PGlite tests
        run: bun run test:db

      - name: Toolchain and release contracts
        run: bun run test:toolchain

      - name: Local schema capability contract
        run: bun run preflight:schema-contract

      - name: Production build with synthetic environment
        run: bun run build

      - name: Client bundle secret scan
        run: bun run check:client-bundle

      - name: Cloudflare Worker runtime smoke
        run: bun run smoke:runtime

  browser-e2e:
    name: Playwright Chromium and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Restore Bun package cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-e2e
          restore-keys: |
            ${{ runner.os }}-bun-1.4.3-

      - name: Reject local environment files
        run: |
          if [[ -e .env || -e .env.local ]]; then
            echo "Local environment files must not be present in CI workspace" >&2
            exit 1
          fi

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build production assets required by CSS E2E assertions
        run: bun run build

      - name: Verify production stylesheet is available to E2E tests
        run: |
          test -d .output/public/assets
          test -n "$(find .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' -print -quit)"

      - name: Install pinned Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium webkit

      - name: Playwright E2E against local mock backend
        run: bun run test:e2e

      - name: Save Bun package cache for trusted branch runs
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-e2e

      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
