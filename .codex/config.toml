# Project defaults for new trusted Codex sessions. Parent/client overrides win.
# Custom agent files do not create separate sandboxes or approval policies.
sandbox_mode = "read-only"
approval_policy = "on-request"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
# Native CLI 0.166.0-alpha.6 validates this key: main -> orchestrator -> worker.
max_depth = 2
